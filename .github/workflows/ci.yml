name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge_ci
          POSTGRES_DB: forge_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U forge -d forge_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      FORGE_REDIS_URL: redis://127.0.0.1:6380/0
      FORGE_TEST_REDIS_URL: redis://127.0.0.1:6380/1
      FORGE_EXECUTION_MODE: queued
      FORGE_DATABASE_URL: postgresql+asyncpg://forge:forge_ci@localhost:5433/forge_test
      FORGE_TEST_DATABASE_URL: postgresql+asyncpg://forge:forge_ci@localhost:5433/forge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv==0.12.10
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: docker build -t forge:ci .
      - run: docker compose up --build --wait api
      - run: curl --fail --retry 5 --retry-delay 2 http://localhost:8000/api/v1/health/ready
      - if: always()
        run: docker compose down -v
