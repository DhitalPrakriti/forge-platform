services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge_local
      POSTGRES_DB: forge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: .
    environment:
      FORGE_DATABASE_URL: postgresql+asyncpg://forge:forge_local@db:5432/forge
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment:
      FORGE_DATABASE_URL: postgresql+asyncpg://forge:forge_local@db:5432/forge
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
